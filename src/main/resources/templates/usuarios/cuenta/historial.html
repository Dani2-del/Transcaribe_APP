<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" th:href="@{/css/usuario.css}" />
  <meta charset="UTF-8" />
  <title>Historial - Transcaribe</title>
</head>
<body>
  <div class="page">
    <div th:replace="fragments/header :: header"></div>

    <main class="center-card wide">
      <div class="card">
        <button class="back-arrow"
                th:onclick="|window.location.href='@{/menu}'|">
          🡨
        </button>

        <h2>Historial de transacciones</h2>
        <p>Usuario: <strong th:text="${usuario.correo}"></strong></p>

        <!-- 🔹 TABLA -->
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Monto</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="t : ${transacciones}">
                <td th:text="${#temporals.format(t.fecha, 'dd/MM/yyyy HH:mm')}">
                  01/01/2025
                </td>
                <td th:text="${t.tipo}">Recarga</td>
                <td th:text="${#numbers.formatDecimal(t.monto, 0, 'COMMA', 2, 'POINT')}">
                  $0.00
                </td>
              </tr>

              <tr th:if="${#lists.isEmpty(transacciones)}">
                <td colspan="3" style="text-align:center;">
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
  </div>
</body>
</html>
