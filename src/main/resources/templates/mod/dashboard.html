<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Moderador Dashboard</title>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
    <div class="page">
        <div class="center-card wide">
            <div class="card">
                <h2>Panel moderador</h2>
                <p>Usuarios disponibles para cobro:</p>

                <div class="table-wrap">
                    <table class="mod-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Saldo Usuario</th>
                                <th>Saldo Tarjeta</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${usuarios}">
                                <td th:text="${u.id}"></td>
                                <td th:text="${u.nombre != null ? u.nombre : '-'}"></td>
                                <td th:text="${u.correo}"></td>
                                <td th:text="${u.saldo}"></td>
                                <td th:text="${u.numeroTarjeta ?: '-'}"></td>
                                <td>
                                    <!-- SOLO COBRAR -->
                                    <button class="card-btn"
                                            th:attr="data-id=${u.id}"
                                            onclick="openChargeModal(this)">
                                        Cobrar pasaje
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <button onclick="window.location.href='/'" class="ghost">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="chargeModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index: 1000;">
        <div style="background:white;padding:20px;border-radius:12px;width:420px; max-width:90%; color:#111;">
            <h3>Cobrar pasaje</h3>
            <p>Monto: <strong>3500</strong></p>

            <input type="hidden" id="modalUserId" />

            <div style="margin-top:12px;">
                <button onclick="submitCharge()" class="primary">Confirmar cobro</button>
                <button onclick="closeModal()" class="ghost">Cancelar</button>
            </div>

            <div id="modalMsg" style="margin-top:10px;color:green"></div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('chargeModal');

        function openChargeModal(button) {
            const id = button.getAttribute('data-id');
            document.getElementById('modalUserId').value = id;
            modal.style.display = 'flex';
        }

        function closeModal(){
            modal.style.display = 'none';
            document.getElementById('modalMsg').textContent = '';
        }

        function submitCharge(){
            const userId = document.getElementById('modalUserId').value;
            const amount = 3500;

            const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

            fetch('/admin/charge', { 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    [header]: token
                },
                body: new URLSearchParams({
                    userId: userId,
                    amount: amount
                })
            })
            .then(r => {
                if (!r.ok) throw new Error("Error " + r.status);
                return r.json();
            })
            .then(res => {
                if(res.status === 'ok') {

                    const rows = document.querySelectorAll('tbody tr');
                    for (const row of rows) {
                        const btn = row.querySelector('button.card-btn');
                        if (btn && btn.getAttribute('data-id') === userId) {
                            const cells = row.querySelectorAll('td');
                            cells[3].textContent = res.usuarioSaldo;
                            cells[4].textContent = res.tarjetaSaldo;
                            break;
                        }
                    }

                    document.getElementById('modalMsg').textContent = 'Cobro realizado ✅';
                    setTimeout(() => closeModal(), 1200);

                } else {
                    alert(res.message);
                }
            })
            .catch(e => {
                console.error(e);
                alert("Error en la petición");
            });
        }
    </script>
</body>
</html>
