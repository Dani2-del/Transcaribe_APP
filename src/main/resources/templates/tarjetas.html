<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Mis Tarjetas - Transcaribe</title>
  <link rel="stylesheet" th:href="@{/style.css}" />
  <style>
    /* Diseño compacto y moderno */
    .tarjeta-slim {
      background: white;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border-left: 5px solid #ff8c00; /* Color Transcaribe */
    }

    .info-principal {
      display: flex;
      flex-direction: column;
    }

    .numero-label {
      font-size: 0.85rem;
      color: #666;
      margin: 0;
    }

    .numero-valor {
      font-size: 1.1rem;
      font-weight: bold;
      color: #333;
      letter-spacing: 1px;
    }

    .saldo-badge {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .acciones {
      display: flex;
      gap: 15px;
    }

    .btn-icon {
      cursor: pointer;
      font-size: 1.1rem;
      transition: transform 0.2s;
      background: none;
      border: none;
    }

    .btn-icon:hover { transform: scale(1.2); }

    .add-section {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.3);
    }
    
    .input-corto {
      padding: 8px;
      border-radius: 5px;
      border: none;
      width: 180px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div th:replace="fragments/header :: header"></div>

    <main class="center-card">
      <div class="card" style="max-width: 600px;"> <h2 style="margin-bottom: 20px;">Mis Tarjetas</h2>

        <div th:if="${not #lists.isEmpty(usuario.tarjetas)}">
            <div th:each="tarjeta : ${usuario.tarjetas}" class="tarjeta-slim">
                
                <div class="info-principal">
                    <p class="numero-label">Número de tarjeta</p>
                    <span class="numero-valor" th:text="${tarjeta.numeroTarjeta}"></span>
                </div>

                <div class="saldo-badge">
                    <span th:text="'$' + ${#numbers.formatDecimal(tarjeta.saldo, 1, 'POINT', 2, 'COMMA')}"></span>
                </div>
                
                <div class="acciones">
                    <button class="btn-icon" title="Editar" 
                            th:onclick="editarTarjeta([[${tarjeta.numeroTarjeta}]])">✏️</button>
                    
                    <form th:action="@{/tarjetas/eliminar}" method="post" style="display:inline;">
                        <input type="hidden" name="numeroTarjeta" th:value="${tarjeta.numeroTarjeta}" />
                        <button type="submit" class="btn-icon" title="Eliminar" 
                                onclick="return confirm('¿Eliminar esta tarjeta?')">🗑️</button>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(usuario.tarjetas)}" class="error-message">
          <p>No tienes tarjetas asociadas.</p>
        </div>

        <div class="add-section">
            <h4 style="margin-bottom: 10px;">Vincular nueva tarjeta</h4>
            <form th:action="@{/tarjetas/agregar}" method="post" style="display: flex; gap: 10px;">
                <input type="text" name="nuevoNumero" class="input-corto" 
                       placeholder="10 dígitos" pattern="\d{10}" maxlength="10" required />
                <button type="submit" class="primary" style="padding: 8px 20px;">Vincular</button>
            </form>
        </div>

        <div class="row" style="margin-top: 30px;">
          <button class="primary" th:onclick="|window.location.href='@{/recarga}'|">Recargar</button>
          <button class="ghost" th:onclick="|window.location.href='@{/menu}'|">Menú</button>
        </div>

        <p class="error" th:if="${error}" th:text="${error}"></p>
        <p class="success" th:if="${mensaje}" th:text="${mensaje}"></p>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
  </div>

  <script th:inline="javascript">
    function editarTarjeta(numeroActual) {
        const nuevoNumero = prompt("Nuevo número (10 dígitos) para reemplazar a " + numeroActual + ":", numeroActual);
        if (nuevoNumero && nuevoNumero.length === 10 && nuevoNumero !== numeroActual) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = /*[[@{/tarjetas/editar}]]*/ '/tarjetas/editar';
            
            const inputActual = document.createElement('input');
            inputActual.type = 'hidden';
            inputActual.name = 'numeroActual';
            inputActual.value = numeroActual;
            
            const inputNuevo = document.createElement('input');
            inputNuevo.type = 'hidden';
            inputNuevo.name = 'nuevoNumero';
            inputNuevo.value = nuevoNumero;
            
            form.appendChild(inputActual);
            form.appendChild(inputNuevo);
            document.body.appendChild(form);
            form.submit();
        }
    }
  </script>
</body>
</html>
