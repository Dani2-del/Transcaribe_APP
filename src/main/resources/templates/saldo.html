<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Saldo - Transcaribe</title>
  <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
  <div class="page">
    <div th:replace="fragments/header :: header"></div>

    <main class="center-card">
      <div class="card">
        <button class="back-arrow"
                th:onclick="|window.location.href='@{/menu}'|">
          🡨
        </button>

        <h2>Mi Tarjeta Transcaribe</h2>

        <!-- 🔥 TARJETA EXISTE -->
        <div th:if="${tarjeta != null}" class="card-details">

          <p class="card-number"
             th:text="'Número: ' + ${tarjeta.numeroTarjeta}">
          </p>

          <h3>Saldo disponible</h3>

          <div class="big-balance"
               th:text="${tarjeta.saldo != null ? #numbers.formatDecimal(tarjeta.saldo, 0, 'COMMA', 2, 'POINT') : '0.00'}">
          </div>

        </div>

        <!-- ❌ SIN TARJETA -->
        <div th:if="${tarjeta == null}" class="error-message">
          <p>No se encontró una tarjeta asociada a tu cuenta.</p>
        </div>

        <div class="row">

          <!-- 🔥 USAR THYMELEAF -->
          <button class="primary"
                  th:onclick="|window.location.href='@{/recarga}'|">
            Recargar
          </button>

        </div>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
  </div>
</body>
</html>
