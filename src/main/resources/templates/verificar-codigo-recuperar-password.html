<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verificar Código - Transcaribe</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
    <style>
        .otp-input {
            font-size: 2rem;
            text-align: center;
            letter-spacing: 10px;
            font-weight: bold;
            border: 2px solid #e63946 !important;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="page">
        <div th:replace="~{fragments/header :: header}"></div>
        <main class="center-card">
            <div class="card">
                <h1 class="title">Verificar Código</h1>
                <p class="info-text" style="text-align: center; color: #457b9d;">
                    Ingresa el código enviado a:<br>
                    <strong th:text="${correo}">correo@ejemplo.com</strong>
                </p>

                <form th:action="@{/validar-codigo-restablecimiento}" method="post" class="form">
                    <input type="hidden" name="correo" th:value="${correo}" />
                    
                    <label for="codigo">Código de 6 dígitos</label>
                    <input type="text" id="codigo" name="codigo" class="otp-input" 
                           maxlength="6" required pattern="\d{6}" autocomplete="off" />

                    <button class="primary" type="submit">Validar Código</button>
                </form>

                <div class="row small" style="margin-top: 15px;">
                    <a th:href="@{/login}">Cancelar y volver</a>
                </div>

                <div th:if="${error}" class="messages">
                    <p class="error" th:text="${error}" style="color: #d93025; text-align: center;"></p>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</body>
</html>
