<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" th:href="@{/css/usuario.css}" />
  <meta charset="UTF-8" />
  <title>Rutas Favoritas - Transcaribe</title>
</head>
<body>
  <div class="page">
    <div th:replace="fragments/header :: header"></div>

    <main class="center-card">
      <div class="card" style="max-width: 600px;">
        <h2 style="margin-bottom: 20px;">Rutas Favoritas</h2>

        <div th:if="${not #lists.isEmpty(usuario.rutasFavoritas)}">
            <div th:each="ruta : ${usuario.rutasFavoritas}" class="ruta-slim">
                <span class="ruta-nombre" th:text="'🚌 ' + ${ruta}"></span>

                <form th:action="@{/rutas/favorito/eliminar}" method="post" style="display:inline;">
                    <input type="hidden" name="ruta" th:value="${ruta}" />
                    <button type="submit" class="btn-icon" title="Quitar de favoritos"
                            onclick="return confirm('¿Quitar esta ruta de tus favoritas?')">🗑️</button>
                </form>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(usuario.rutasFavoritas)}" class="error-message">
          <p>Aún no tienes rutas favoritas.</p>
        </div>

        <div class="add-section">
            <h4 style="margin-bottom: 10px;">Agregar ruta a favoritos</h4>
            <form th:action="@{/rutas/favorito/agregar}" method="post" style="display: flex; gap: 10px;">
                <select name="ruta" class="select-ruta" required>
                    <option value="" disabled selected>Selecciona una ruta de Transcaribe...</option>
                    <option th:each="r : ${rutasDisponibles}"
                            th:value="${r}"
                            th:text="${r}">
                    </option>
                </select>
                <button type="submit" class="primary" style="padding: 8px 20px; white-space: nowrap;">Agregar</button>
            </form>
        </div>

        <div class="row" style="margin-top: 30px;">
          <button class="ghost" th:onclick="|window.location.href='@{/menu}'|">Menú</button>
        </div>

        <p class="error" th:if="${error}" th:text="${error}"></p>
        <p class="success" th:if="${mensaje}" th:text="${mensaje}"></p>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
  </div>
</body>
</html>
