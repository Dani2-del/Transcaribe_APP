<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Recargar - Transcaribe</title>
  <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
  <div class="page">
    <div th:replace="fragments/header :: header"></div>

    <main class="center-card">
      <div class="card" style="background: white; color: #4a5568; max-width: 760px; margin: 0 auto; padding: 36px 32px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid rgba(240,148,84,0.2); position: relative; text-align: center;">
        <button class="back-arrow"
                th:onclick="|window.location.href='@{/menu}'|"
                style="color: #f09454;">
          🡨
        </button>

        <h2 style="color: #f09454; margin-bottom: 16px; font-size: 1.95rem;">Recargar saldo</h2>
        <p style="color: #4a5568;">Usuario: <strong th:text="${usuario.correo}"></strong></p>

        <form th:action="@{/recargar}" method="post" class="recarga-form" id="recargaForm">
          
          <div class="form-section full-width">
            <label for="monto" style="color: #4a5568;">Monto a recargar</label>
            <input id="monto" type="number" name="monto" min="1" step="1" placeholder="Ej: 5000" required />
          </div>

          <div class="form-section full-width">
            <label style="color: #4a5568;">Método de pago</label>
            <div class="radio-options" style="background: transparent;">
              <label style="background: rgba(240,148,84,0.08); border: 1px solid rgba(240,148,84,0.3); color: #4a5568;">
                <input type="radio" name="metodoPago" value="pse" checked onchange="togglePaymentFields()"/> PSE
              </label>
              <label style="background: rgba(240,148,84,0.08); border: 1px solid rgba(240,148,84,0.3); color: #4a5568;">
                <input type="radio" name="metodoPago" value="tarjetaCredito" onchange="togglePaymentFields()"/> Tarjeta de crédito / débito
              </label>
            </div>
          </div>

          <div id="pseFields" class="form-section full-width active-section">
            <label for="correoPSE" style="color: #4a5568;">Correo PSE</label>
            <input id="correoPSE" name="correoPSE" type="email" placeholder="correo@ejemplo.com" />

            <label for="contrasenaPSE" style="color: #4a5568;">Contraseña PSE</label>
            <input id="contrasenaPSE" name="contrasenaPSE" type="password" placeholder="Contraseña" />
          </div>

          <div id="tarjetaCreditoFields" class="form-section full-width" style="display: none;">
            <label for="numeroTarjetaPago" style="color: #4a5568;">Número de tarjeta (pago)</label>
            <input id="numeroTarjetaPago" name="numeroTarjetaPago" type="text" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456" />

            <div class="grid-2">
              <div>
                <label for="fechaVencimientoPago" style="color: #4a5568;">Fecha de vencimiento (MM/AA)</label>
                <input id="fechaVencimientoPago" name="fechaVencimientoPago" type="text" maxlength="5" placeholder="MM/AA" />
              </div>
              <div>
                <label for="cvvPago" style="color: #4a5568;">CVV</label>
                <input id="cvvPago" name="cvvPago" type="password" inputmode="numeric" maxlength="4" placeholder="123" />
              </div>
            </div>
          </div>

          <div class="form-section full-width">
            <label for="numeroTarjeta" style="color: #4a5568;">Tarjeta Transcaribe destino</label>
            <select id="numeroTarjeta" name="numeroTarjeta" required 
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(240,148,84,0.3); background-color: white; font-size: 1rem; color: #4a5568;">
              <option value="" disabled selected>Selecciona una de tus tarjetas</option>
              <option th:each="t : ${usuario.tarjetas}" 
                      th:value="${t.numeroTarjeta}" 
                      th:text="${'Tarjeta: ' + t.numeroTarjeta + ' (Saldo: $' + t.saldo + ')'}">
              </option>
            </select>
            <small style="color: #a0aec0; font-size: 0.88rem;">El saldo se aplicará a la tarjeta que selecciones.</small>
          </div>

          <div class="form-section full-width button-section">
            <button type="submit" style="width: 100%; cursor: pointer; margin-top: 8px; padding: 14px 18px; border-radius: 14px; background: #f09454; color: white; border: none; font-size: 1rem; font-weight: 700; box-shadow: 0 4px 15px rgba(240,148,84,0.3); transition: all 0.2s ease;">
              Confirmar Recarga
            </button>
          </div>
        </form>

        <p class="error" th:if="${error}" th:text="${error}" style="color: #dc3545; background: #ffebee; padding: 10px; border-radius: 5px; margin-top: 15px;"></p>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
  </div>

  <script>
    function togglePaymentFields(){
      const method = document.querySelector('input[name="metodoPago"]:checked').value;
      const pse = document.getElementById('pseFields');
      const tc = document.getElementById('tarjetaCreditoFields');
      if(method === 'tarjetaCredito') { 
        pse.style.display = 'none'; 
        tc.style.display = 'block'; 
      } else { 
        pse.style.display = 'block'; 
        tc.style.display = 'none'; 
      }
    }

    document.addEventListener('input', (e)=>{
      if(e.target.id === 'numeroTarjetaPago'){
        let v = e.target.value.replace(/\D/g,'').slice(0,16);
        e.target.value = v.replace(/(.{4})/g,'$1 ').trim();
      }
      if(e.target.id === 'fechaVencimientoPago'){
        let v = e.target.value.replace(/\D/g,'').slice(0,4);
        if(v.length > 2) v = v.slice(0,2) + '/' + v.slice(2);
        e.target.value = v;
      }
    });
  </script>
</body>
</html>
