<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - Transcaribe</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
    <style>
        .info-text {
            text-align: center;
            margin-bottom: 25px;
            color: #457b9d;
            font-size: 0.95em;
            line-height: 1.5;
        }
        .back-to-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #1d3557;
            text-decoration: none;
        }
        .back-to-login:hover { text-decoration: underline; }
        
        /* Resaltado para el icono o encabezado */
        .recovery-icon {
            display: block;
            margin: 0 auto 15px;
            width: 50px;
            height: 50px;
            background: #f1faee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e63946;
            font-size: 1.5rem;
        }
    </style>
</head>
<body class="login-page">
    <div class="page">
        <div th:replace="~{fragments/header :: header}"></div>

        <main class="center-card">
            <div class="card">
                <div class="recovery-icon">🔑</div>
                <h1 class="title">¿Olvidaste tu clave?</h1>
                
                <p class="info-text">
                    No te preocupes. Ingresa tu correo electrónico y te enviaremos un 
                    <strong>código de seguridad</strong> para restablecer tu cuenta de Transcaribe.
                </p>

                <form th:action="@{/olvido-password}" method="post" class="form">
                    <!-- Token CSRF para seguridad en Spring Security -->

                    <label for="correo">Correo Electrónico</label>
                    <input type="email" 
                           id="correo"
                           name="correo" 
                           placeholder="ejemplo@correo.com" 
                           required 
                           autocomplete="email" />

                    <button class="primary" type="submit">Enviar Código</button>
                </form>

                <a th:href="@{/login}" class="back-to-login">← Volver al inicio de sesión</a>

                <!-- Alertas de error si el correo no existe -->
                <div class="messages" style="margin-top: 20px;">
                    <p class="error" th:if="${error}" th:text="${error}" 
                       style="color: #d93025; background: #fce8e6; padding: 10px; border-radius: 4px; text-align: center; font-size: 0.85em;">
                    </p>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</body>
</html>
