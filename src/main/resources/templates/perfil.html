<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" th:href="@{/css/usuario.css}" />
  <meta charset="UTF-8" />
  <title>Editar Perfil</title>
</head>
<body>
  <div class="page">

    <main class="center-card">
      <div class="card card-narrow">
        <button class="back-arrow"
                onclick="window.location.href='/menu'">
          🡨
        </button>

        <h2>Editar credenciales</h2>
        <p class="form-hint">Actualiza tu nombre, correo o contraseña.</p>

        <!-- 🔹 MENSAJES -->
        <p class="success" th:if="${mensaje}" th:text="${mensaje}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <!-- 🔹 FORMULARIO -->
        <form class="form" th:action="@{/perfil}" method="post">

          <label for="nombre">Nombre</label>
          <input type="text"
                 id="nombre"
                 name="nombre"
                 th:value="${usuario.nombre}"
                 required />

          <label for="correo">Correo</label>
          <input type="email"
                 id="correo"
                 name="correo"
                 th:value="${usuario.correo}"
                 required />

          <label for="password">Nueva contraseña</label>
          <input type="password"
                 id="password"
                 name="password"
                 placeholder="Dejar vacío para no cambiar" />

          <button type="submit" class="primary" style="margin-top: 10px;">
            Guardar cambios
          </button>

        </form>

      </div>
    </main>

  </div>
</body>
</html>
