<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" th:href="@{/css/usuario.css}" />
    <meta charset="UTF-8" />
    <title>Menú - Transcaribe</title>
</head>
<body class="menu-page">
    <div class="page">
        <div th:replace="~{fragments/header :: header}"></div>

        <main class="center-card">
            <div class="card dashboard">

                <div class="user-row">
                    <div class="avatar"
                         th:text="${#strings.toUpperCase(#strings.substring(usuario.nombre != null ? usuario.nombre : usuario.correo, 0, 1))}">
                        U
                    </div>
                    <div>
                        <div class="user-name"
                             th:text="${usuario.nombre != null ? usuario.nombre : usuario.correo}">
                            Usuario
                        </div>
                        <div class="user-email"
                             th:text="${usuario.correo}">
                            correo@example.com
                        </div>
                    </div>
                </div>

                <div class="grid">
                    <button class="card-btn"
                            th:onclick="|window.location.href='@{/tarjetas}'|">
                        Mis Tarjetas
                    </button>

                    <button class="card-btn"
                            th:onclick="|window.location.href='@{/recarga}'|">
                        Recargar
                    </button>

                    <button class="card-btn"
                            th:onclick="|window.location.href='@{/historial}'|">
                        Historial
                    </button>

                    <button class="card-btn"
                            th:onclick="|window.location.href='@{/perfil}'|">
                        Configuración
                    </button>

                    <button class="card-btn"
                            th:onclick="|window.location.href='@{/rutas}'|">
                        Opciones de Rutas
                    </button>

                    <button class="card-btn"
                            th:onclick="|window.location.href='@{/limite-saldo}'|">
                        Configurar Límite
                    </button>

                    <div class="bus-container" style="margin-bottom: 15px; width: 100%; box-sizing: border-box;">

                        <form th:action="@{/api/buses/simular-viaje}" method="post">

                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <input type="hidden" name="usuarioId" th:value="${usuario.id}" />

                            <div style="margin-bottom: 15px;">
                                <label style="display: block; font-size: 0.9rem; color: var(--coral); font-weight: bold; margin-bottom: 8px;">
                                    📍 Pagar con mi tarjeta:
                                </label>
                                <select name="numeroTarjeta" class="select-bus" required>
                                    <option value="" disabled selected>Selecciona tu tarjeta Transcaribe...</option>
                                    <option th:each="t : ${usuario.tarjetas}"
                                            th:value="${t.numeroTarjeta}"
                                            th:text="${'💳 ' + t.numeroTarjeta + ' (Saldo: $' + #numbers.formatDecimal(t.saldo, 0, 'COMMA', 0, 'POINT') + ')'}">
                                    </option>
                                </select>
                            </div>

                            <button type="submit" class="bus-btn"
                                    onclick="return confirm('¿Confirmas el pago de $3.000 para tu viaje?')">
                                Simular Viaje
                            </button>
                        </form>
                    </div>

                    <form th:action="@{/logout}" method="post" style="grid-column: 1 / -1;">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="ghost" type="submit" style="width: 100%; cursor: pointer;">Cerrar sesión</button>
                    </form>
                </div>

                <div style="margin-top: 15px; text-align: center; width: 100%;">
                    <p class="success" th:if="${mensaje}" th:text="${mensaje}"></p>
                    <p class="error" th:if="${error}" th:text="${error}"></p>
                </div>

            </div>
        </main>

        <!-- Botón flotante solo visible para administradores -->
        <a th:if="${usuario.role == 'ROLE_ADMIN'}"
           th:href="@{/admin/dashboard}"
           class="admin-switch-btn">
            ⚙️ Panel Admin
        </a>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</body>
</html>
