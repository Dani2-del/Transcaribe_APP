<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verificar Registro - Transcaribe</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
    <style>
        .otp-input {
            font-size: 2rem;
            text-align: center;
            letter-spacing: 10px;
            font-weight: bold;
            border: 2px solid #e63946 !important;
            color: #1d3557;
        }
        .info-text {
            text-align: center;
            margin-bottom: 20px;
            color: #457b9d;
        }
    </style>
</head>
<body>
    <div class="page">
        <div th:replace="~{fragments/header :: header}"></div>

        <main class="center-card">
            <div class="card">
                <h1 class="title">Verifica tu correo</h1>
                
                <p class="info-text">
                    Ingresa el código de 6 dígitos que enviamos a:<br>
                    <strong th:text="${correo}">usuario@correo.com</strong>
                </p>

                <form th:action="@{/verificar-otp}" method="post" class="form">
                    <input type="hidden" 
                           th:if="${_csrf}" 
                           th:name="${_csrf.parameterName}" 
                           th:value="${_csrf.token}" />

                    <input type="hidden" name="correo" th:value="${correo}" />

                    <input type="text" 
                           name="codigo" 
                           placeholder="000000" 
                           class="otp-input" 
                           maxlength="6" 
                           required 
                           pattern="\d{6}" 
                           title="Deben ser 6 números"
                           autocomplete="off" />

                    <button class="primary" type="submit">Confirmar Registro</button>
                </form>

                <div class="row small">
                    <span>¿No te llegó?</span>
                    <a th:href="@{/registro}">Volver a intentar</a>
                </div>

                <p class="error" th:if="${error}" th:text="${error}" style="margin-top: 15px;"></p>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</body>
</html>
